<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Title -->
    <title>ScanMyCard — Scan. Manage. Connect.</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="ScanMyCard is an AI-powered business card scanner that helps you scan, organize, manage and connect with your business contacts."
    />

    <meta
      name="keywords"
      content="ScanMyCard, business card scanner, AI business card scanner, digital contacts, contact management, networking app, scan business card"
    />

    <meta
      name="author"
      content="ScanMyCard"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Replace this with your real ScanMyCard domain when ready -->
    <link
      rel="canonical"
      href="https://scanmycard.in/"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://scanmycard.com/"
    />

    <meta
      property="og:title"
      content="ScanMyCard — Scan. Manage. Connect."
    />

    <meta
      property="og:description"
      content="Turn business cards into organized digital contacts with ScanMyCard."
    />

    <meta
      property="og:image"
      content="https://scanmycard.com/og-image.png"
    />

    <meta
      property="og:site_name"
      content="ScanMyCard"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:url"
      content="https://scanmycard.com/"
    />

    <meta
      name="twitter:title"
      content="ScanMyCard — Scan. Manage. Connect."
    />

    <meta
      name="twitter:description"
      content="Scan, manage and connect with your business contacts using AI."
    />

    <meta
      name="twitter:image"
      content="https://scanmycard.com/og-image.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#004AD9"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="ScanMyCard"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
